# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test simulator preparation script
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Prepare iOS simulator
        timeout-minutes: 15
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          sudo env DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -runFirstLaunch
          bash .github/scripts/prepare-ios-simulator.sh

      - name: Build for testing
        run: |
          xcodebuild \
            -project Ritli.xcodeproj \
            -scheme Ritli \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build-for-testing

      - name: Run unit tests
        run: |
          xcodebuild \
            -project Ritli.xcodeproj \
            -scheme Ritli \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/RitliUnitTests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:RitliTests \
            test-without-building

      # Xcode distributes XCTest classes across two isolated simulator clones.
      # Keep system UI on the original simulator in the sequential steps below.
      - name: Run app UI tests on two simulators
        run: |
          xcodebuild \
            -project Ritli.xcodeproj \
            -scheme Ritli \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/RitliAppUITests.xcresult" \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count 2 \
            -only-testing:RitliUITests \
            -skip-testing:RitliUITests/SystemUITests \
            -skip-testing:RitliUITests/LiveActivityUITests \
            test-without-building

      # Hosted simulators can drop the cross-app Settings foreground transition.
      # Its URL is unit-tested, and the complete handoff remains in the local UI suite.
      - name: Run background lifecycle UI tests in isolation
        run: |
          xcodebuild \
            -project Ritli.xcodeproj \
            -scheme Ritli \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/RitliSystemUITests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:RitliUITests/SystemUITests \
            -skip-testing:RitliUITests/SystemUITests/testOpensAppLanguageSettings \
            test-without-building

      - name: Run Live Activity system UI tests in isolation
        run: |
          for attempt in 1 2; do
            if xcodebuild \
              -project Ritli.xcodeproj \
              -scheme Ritli \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -resultBundlePath "$RUNNER_TEMP/RitliLiveActivityUITests-attempt-${attempt}.xcresult" \
              -parallel-testing-enabled NO \
              -only-testing:RitliUITests/LiveActivityUITests \
              test-without-building; then
              exit 0
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "Live Activity system UI test failed; restarting the simulator and retrying once."
              xcrun simctl shutdown "$IOS_SIMULATOR_ID" || true
              xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
            fi
          done

          exit 1

      - name: Verify Release startup behavior
        run: |
          xcodebuild \
            -project Ritli.xcodeproj \
            -scheme Ritli \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/ReleaseTests" \
            -resultBundlePath "$RUNNER_TEMP/RitliReleaseTests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:RitliTests/SplashPresentationTests \
            -only-testing:RitliTests/OnboardingStoreTests \
            ENABLE_TESTABILITY=YES \
            test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ritli-test-results
          path: |
            ${{ runner.temp }}/RitliUnitTests.xcresult
            ${{ runner.temp }}/RitliAppUITests.xcresult
            ${{ runner.temp }}/RitliSystemUITests.xcresult
            ${{ runner.temp }}/RitliLiveActivityUITests-attempt-*.xcresult
            ${{ runner.temp }}/RitliReleaseTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up iOS simulator
        if: ${{ always() && env.IOS_SIMULATOR_ID != '' }}
        run: |
          xcrun simctl shutdown "$IOS_SIMULATOR_ID" || true
          xcrun simctl delete "$IOS_SIMULATOR_ID"
