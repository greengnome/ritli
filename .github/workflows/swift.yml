# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for testing
        run: |
          xcodebuild \
            -project Ritli.xcodeproj \
            -scheme Ritli \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build-for-testing

      # Hosted simulators can drop the cross-app Settings foreground transition.
      # Its URL is unit-tested, and the complete handoff remains in the local UI suite.
      - name: Run tests
        run: |
          xcodebuild \
            -project Ritli.xcodeproj \
            -scheme Ritli \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/RitliTests.xcresult" \
            -parallel-testing-enabled NO \
            -skip-testing:RitliUITests/RitliUITests/testDisplaysRunningTimerOutsideApp \
            -skip-testing:RitliUITests/RitliUITests/testOpensAppLanguageSettings \
            test-without-building

      - name: Run Live Activity system UI test in isolation
        run: |
          for attempt in 1 2; do
            if xcodebuild \
              -project Ritli.xcodeproj \
              -scheme Ritli \
              -configuration Debug \
              -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -resultBundlePath "$RUNNER_TEMP/RitliLiveActivityUITests-attempt-${attempt}.xcresult" \
              -parallel-testing-enabled NO \
              -only-testing:RitliUITests/RitliUITests/testDisplaysRunningTimerOutsideApp \
              test-without-building; then
              exit 0
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "Live Activity system UI test failed; restarting the simulator and retrying once."
              xcrun simctl shutdown booted || true
            fi
          done

          exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ritli-test-results
          path: |
            ${{ runner.temp }}/RitliTests.xcresult
            ${{ runner.temp }}/RitliLiveActivityUITests-attempt-*.xcresult
          if-no-files-found: ignore
          retention-days: 7
